# Pornește tot sistemul: docker compose up --build
# Doar infrastructura, pentru dezvoltare locală: docker compose up db redis
name: mini-erp

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_erp
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_erp"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/mini_erp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Migrările rulează la pornire; în producție le-aș rula ca pas separat în pipeline.
    command: sh -c "/app/node_modules/.bin/prisma migrate deploy && node dist/server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      retries: 30

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    command: node dist/worker.js

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: "http://api:4000" }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
